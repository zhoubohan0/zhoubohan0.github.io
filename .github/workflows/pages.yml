name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read pinned CV commit
        id: cv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules --get submodule.cv.url)" = 'git@github.com:zhoubohan0/CV-ZBH.git'
          read -r mode type sha path < <(git ls-tree HEAD -- cv)
          test "$mode" = 160000
          test "$type" = commit
          test "$path" = cv
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out private CV at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zhoubohan0/CV-ZBH
          ref: ${{ steps.cv.outputs.sha }}
          path: cv
          ssh-key: ${{ secrets.CV_SUBMODULE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Prepare public files only
        run: python3 .github/scripts/build_site.py "$RUNNER_TEMP/public-site"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
